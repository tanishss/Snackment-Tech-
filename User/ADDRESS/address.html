<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>

        Hostel Address | Snackment

    </title>

    <!-- Google Font -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="address.css">

</head>
<body>

    <!-- ================= HEADER ================= -->

    <header class="address-header">

        <button class="back-btn">

            <img src="../../Assets/Images/Symbols/arrow-small-left.svg" alt="Back">

        </button>

        <img class="header-logo" src="../../Assets/Images/Original logos/Snackment_logotext_transparent.png"
            alt="Snackment">

    </header>

    <!-- ================= MAIN ================= -->

    <main class="address-page">

        <!-- ================= PAGE TITLE ================= -->

        <section class="page-heading">

            <h1>Hostel Address</h1>

            <p>
                Manage your saved hostel delivery locations.
            </p>

        </section>

        <!-- ================= SECTION HEADER ================= -->

        <section class="saved-addresses">

            <div class="saved-header">

                <div class="saved-title">

                    <h2>Saved Addresses</h2>

                    <span class="address-count" id="addressCount">

                    </span>

                </div>

                <button class="add-address-btn" type="button">

                    <span class="plus">

                        +</span>

                    <span>

                        Add Address

                    </span>

                </button>

            </div>

            <!-- JS Renders Cards Here -->

            <div id="addressesContainer" class="addresses-list">

            </div>

        </section>

    </main>

    <!-- ===================================================== -->
    <!-- ADDRESS MODAL -->
    <!-- ===================================================== -->

    <div class="overlay" id="addressOverlay">

    </div>

    <div class="address-modal" id="addressModal" role="dialog">

        <!-- Top -->

        <div class="modal-header">

            <div>

                <h2 id="modalTitle">

                    Add Address

                </h2>

                <p class="modal-subtitle">

                    Save another hostel delivery location.

                </p>

            </div>

            <button class="close-modal" type="button" aria-label="Close">

                &times;

            </button>

        </div>

        <!-- Form -->

        <form id="addressForm" novalidate>

            <!-- Hostel -->

            <div class="form-group">

                <label>

                    Hostel Name

                </label>

                <select id="hostelInput">

    <option value="">
        Select Hostel
    </option>

    <option value="CSE Boys Hostel">
        CSE Boys Hostel
    </option>

</select>
            </div>


            <!-- Room -->

            <div class="form-group">

                <label>

                    Room Number

                </label>

                <input id="roomInput" type="text" placeholder="Room Number">

            </div>

            <!-- Address -->

            <div class="form-group">

                <label>

                    Complete Address

                </label>

                <textarea id="addressInput" rows="4" maxlength="150"
                    placeholder="Landmark, Floor, Wing etc."></textarea>
                </textarea>

            </div>

            <!-- Default Switch -->

            <div class="default-switch-row">

                <label class="switch">

                    <input id="defaultSwitch" type="checkbox">

                    <span class="slider"></span>

                </label>

                <span>

                    Set as default address

                </span>

            </div>

            <!-- Submit -->

            <button id="saveAddressBtn" type="submit">

                Save Address

            </button>

        </form>

    </div>

    <!-- ===================================================== -->
    <!-- DELETE MODAL -->
    <!-- ===================================================== -->

    <div class="delete-overlay" id="deleteOverlay">

    </div>

    <div class="delete-modal" id="deleteModal" role="dialog">

        <div class="delete-icon">

            <img src="../../Assets/Images/Symbols/eraser.svg">

        </div>

        <h2>

            Delete Address?

        </h2>

        <p>

            Are you sure you want to remove this saved hostel address?

            This action cannot be undone.

        </p>

        <div class="delete-actions">

            <button id="cancelDeleteBtn" type="button">

                Cancel

            </button>

            <button id="confirmDeleteBtn" type="button">

                Delete

            </button>

        </div>

    </div>

    <script src="address.js"></script>

</body>
</html>
