<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Order Details | Snackment</title>

    <link rel="stylesheet"
        href="order-details.css">

</head>

<body>

    <main class="order-page">

        <!-- ==========================================================
             PAGE HEADER
        =========================================================== -->

        <header class="page-header">

            <button class="back-btn">

                ← Back

            </button>

            <h1>

                Order Details

            </h1>

        </header>

        <!-- ==========================================================
             HERO CARD
        =========================================================== -->

        <section class="card hero-card">

            <div class="hero-left">

                <h2 id="orderId">

                    #SNK0001

                </h2>

                <p id="orderDate">

                    7 Aug 2026 • 7:42 PM

                </p>

            </div>

            <span
                id="orderStatus"
                class="status-badge">

                Delivered

            </span>

        </section>

        <!-- ==========================================================
             ORDER TIMELINE
        =========================================================== -->

        <section class="card">

            <h3>

                Order Timeline

            </h3>

            <div
                id="timelineContainer">

            </div>

        </section>

        <!-- ==========================================================
             ORDER ITEMS
        =========================================================== -->

        <section class="card">

            <h3>

                Ordered Items

            </h3>

            <div
                id="itemsContainer">

            </div>

        </section>

        <!-- ==========================================================
             BILL SUMMARY
        =========================================================== -->

        <section class="card">

            <h3>

                Bill Summary

            </h3>

            <div
                id="billContainer">

            </div>

        </section>

        <!-- ==========================================================
             DELIVERY DETAILS
        =========================================================== -->

        <section class="card">

            <h3>

                Delivery Details

            </h3>

            <div
                id="deliveryContainer">

            </div>

        </section>

        <!-- ==========================================================
             PAYMENT DETAILS
        =========================================================== -->

        <section class="card">

            <h3>

                Payment

            </h3>

            <div
                id="paymentContainer">

            </div>

        </section>

        <!-- ==========================================================
             ORDER INFO
        =========================================================== -->

        <section class="card">

            <h3>

                Order Information

            </h3>

            <div
                id="infoContainer">

            </div>

        </section>

        <!-- ==========================================================
             HELP
        =========================================================== -->

        <section class="card help-card">

            <h3>

                Need Help?

            </h3>

            <p>

                Contact Snackment Support if you have
                any issue regarding this order.

            </p>

            <button
                class="support-btn">

                Contact Support

            </button>

        </section>

    </main>

    <script src="order-details.js"></script>

</body>

</html>
